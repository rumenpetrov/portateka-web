<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Web app where you organize and manage your property portfolio information." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111318" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        const storedScheme = localStorage.getItem("color-scheme");
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta && (storedScheme === "light" || storedScheme === "dark")) {
          meta.content = storedScheme;
        }
        if (storedScheme === "light" || storedScheme === "dark") {
          const themeColor = storedScheme === "dark" ? "#111318" : "#faf8fc";
          const themeMetas = document.querySelectorAll('meta[name="theme-color"]');
          for (const themeMeta of themeMetas) {
            themeMeta.setAttribute("content", themeColor);
          }
        }
      } catch {
        // Ignore storage access errors in restricted contexts
      }
    </script>
    <title>Portateka</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
